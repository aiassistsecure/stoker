<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>Stoker — Chat</title>
<link rel="manifest" href="/manifest.json">
<style>
:root{--bg:#0a0a0f;--card:#14141c;--txt:#e8e8f0;--dim:#8a8a99;--acc:#ff7a1a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,system-ui,sans-serif;max-width:600px;margin:0 auto;display:flex;flex-direction:column;height:100dvh}
header{padding:calc(12px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid #22222e}
select{background:var(--card);color:var(--txt);border:1px solid #2a2a38;border-radius:10px;padding:10px;font-size:15px;width:100%}
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{background:var(--card);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.5;white-space:pre-wrap}
.msg.user{background:#1c2a1c;align-self:flex-end;max-width:85%}
.msg.assistant{align-self:flex-start;max-width:95%}
#bar{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #22222e}
#in{flex:1;background:var(--card);border:1px solid #2a2a38;color:var(--txt);border-radius:12px;padding:12px;font-size:16px}
#send{background:var(--acc);border:none;border-radius:12px;padding:12px 18px;font-weight:700}
#stop{background:#3f1212;color:#ff8080;border:none;border-radius:12px;padding:12px 18px;font-weight:700}
.hidden{display:none!important}
#login{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;justify-content:center;padding:32px;z-index:50}
#login input{background:var(--card);border:1px solid #2a2a38;color:var(--txt);border-radius:10px;padding:14px;font-size:16px;margin-bottom:12px;width:100%}
#login button{background:var(--acc);color:#000;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:700;width:100%}
nav{position:fixed;bottom:0;left:0;right:0;background:#101016;border-top:1px solid #22222e;display:flex}
nav a{flex:1;text-align:center;padding:14px 0;color:var(--dim);text-decoration:none;font-size:11px}
nav a.on{color:var(--acc)}
.typing{color:var(--dim);font-size:13px}
</style>
</head>
<body>
<div id="login"><h1>🔥 Stoker</h1><p style="color:var(--dim);margin-bottom:12px">Enter your init token.</p><input id="token" type="password" placeholder="Init token"><button onclick="doLogin()">Open Deck</button></div>
<header><select id="model"><option>Loading models…</option></select></header>
<div id="msgs"></div>
<div id="bar">
  <input id="in" placeholder="Message…" autocomplete="off">
  <button id="send" onclick="send()">➤</button>
  <button id="stop" class="hidden" onclick="cancelGen()">■</button>
</div>
<script src="/app.js"></script>
<script>
let history=[],opId=null,es=null;
async function tick(){
  try{
    const ms=await api('/api/v1/inference/models');
    const sel=document.getElementById('model');
    sel.innerHTML=ms.map(m=>`<option value="${m.id}">${m.id}</option>`).join('')||'<option>No serving models</option>';
  }catch(e){}
}
function addMsg(role,text){
  const d=document.createElement('div');d.className='msg '+role;d.textContent=text;
  document.getElementById('msgs').appendChild(d);d.scrollIntoView();
  return d;
}
async function send(){
  const input=document.getElementById('in');const text=input.value.trim();if(!text)return;
  const model=document.getElementById('model').value;
  addMsg('user',text);input.value='';
  history.push({role:'user',content:text});
  const bubble=addMsg('assistant','');bubble.classList.add('typing');bubble.textContent='…';
  document.getElementById('send').classList.add('hidden');
  document.getElementById('stop').classList.remove('hidden');
  try{
    const r=await fetch('/api/v1/inference/chat',{method:'POST',credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model,messages:history})});
    const reader=r.body.getReader();const dec=new TextDecoder();let buf='',out='';
    bubble.classList.remove('typing');bubble.textContent='';
    while(true){
      const {done,value}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      for(const part of buf.split('\n\n')){buf=buf.slice(part.length+2);
        const m=part.match(/event: (\S+)\ndata: (.*)/s);if(!m)continue;
        const [_,ev,raw]=m;let d;try{d=JSON.parse(raw);}catch{continue;}
        if(ev==='chat.start')opId=d.operation_id;
        else if(ev==='chat.token'){out+=d.delta;bubble.textContent=out;}
        else if(ev==='chat.error'){bubble.textContent='⚠ '+d.message;}
        else if(ev==='chat.done'){history.push({role:'assistant',content:out});}
      }
    }
  }catch(e){bubble.textContent='⚠ connection lost';}
  document.getElementById('send').classList.remove('hidden');
  document.getElementById('stop').classList.add('hidden');
}
async function cancelGen(){
  if(opId)await api(`/api/v1/inference/chat/${opId}/cancel`,{method:'POST'});
}
document.getElementById('in').addEventListener('keydown',e=>{if(e.key==='Enter')send();});
tick();
</script>
</body>
</html>
